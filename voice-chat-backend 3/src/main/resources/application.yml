server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/voicechat;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  token-ttl: 24h
  context-rounds: 20
  context-max-chars: 16000
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout: ${DEEPSEEK_TIMEOUT:60s}
    json-mode: ${DEEPSEEK_JSON_MODE:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
